name: Deploy

on:
  push:
    branches:
      - main
  watch:
    types: [started]
  repository_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build
        env:
          NODE_ENV: production

      - name: Convert config.yaml to config.json
        shell: bash
        run: |
          yarn add -D js-yaml

          node - <<'NODE'
          const fs = require('fs');
          const yaml = require('js-yaml');

          const config = yaml.load(fs.readFileSync('config.yaml', 'utf8'));
          fs.writeFileSync('config.json', JSON.stringify(config, null, 2));
          NODE

          grep -R "config.yaml" -n src workers-site || true

          find src workers-site -type f \( -name "*.js" -o -name "*.mjs" -o -name "*.ts" \) \
            -exec sed -i 's#../../config.yaml#../../config.json#g' {} \;

          grep -R "config.json" -n src workers-site || true

      - name: Patch wrangler.toml for Wrangler v3
        shell: bash
        run: |
          echo "Original wrangler.toml:"
          cat wrangler.toml

          SITE_ENTRY_POINT=$(awk '
            /^\[site\]/ { in_site=1; next }
            /^\[/ && in_site { in_site=0 }
            in_site && $1 ~ /^entry-point/ {
              gsub(/"/, "", $3);
              print $3;
              exit
            }
          ' wrangler.toml)

          if [ -z "$SITE_ENTRY_POINT" ]; then
            SITE_ENTRY_POINT="workers-site"
          fi

          echo "Detected site entry-point: ${SITE_ENTRY_POINT}"

          sed -i '/entry-point/d' wrangler.toml

          if ! grep -qE '^main\s*=' wrangler.toml; then
            sed -i "1imain = \"${SITE_ENTRY_POINT}/index.js\"" wrangler.toml
          fi

          if grep -q '^\[env.production\]' wrangler.toml; then
            echo "env.production already exists, skip append"
          else
            cat >> wrangler.toml <<'EOF'

          [env.production]
          kv_namespaces = [
            { binding = "KV_STATUS_PAGE", id = "cddae738342a487fbff2b90b3cb03123" }
          ]
          EOF
          fi

          echo "Patched wrangler.toml:"
          cat wrangler.toml

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          command: deploy --env production
          postCommands: |
            yarn kv-gc
          secrets: |
            SECRET_TELEGRAM_API_TOKEN
            SECRET_TELEGRAM_CHAT_ID
        env:
          SECRET_TELEGRAM_API_TOKEN: ${{ secrets.SECRET_TELEGRAM_API_TOKEN }}
          SECRET_TELEGRAM_CHAT_ID: ${{ secrets.SECRET_TELEGRAM_CHAT_ID }}
