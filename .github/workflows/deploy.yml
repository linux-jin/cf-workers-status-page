name: Deploy

on:
  push:
    branches:
      - main
  watch:
    types: [started]
  repository_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build
        env:
          NODE_ENV: production

      - name: Patch wrangler.toml
        shell: bash
        run: |
          echo "Patching wrangler.toml..."

          # Wrangler v3 需要 main 入口
          if ! grep -qE '^main\s*=' wrangler.toml; then
            sed -i '1imain = "index.js"' wrangler.toml
          fi

          # 写入 production 环境 KV 绑定
          cat >> wrangler.toml <<'EOF'

          [env.production]
          kv_namespaces = [
            { binding = "KV_STATUS_PAGE", id = "cddae738342a487fbff2b90b3cb03123" }
          ]
          EOF

          echo "Current wrangler.toml:"
          cat wrangler.toml

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          command: deploy --env production
          postCommands: |
            yarn kv-gc
          secrets: |
            SECRET_TELEGRAM_API_TOKEN
            SECRET_TELEGRAM_CHAT_ID
        env:
          SECRET_TELEGRAM_API_TOKEN: ${{ secrets.SECRET_TELEGRAM_API_TOKEN }}
          SECRET_TELEGRAM_CHAT_ID: ${{ secrets.SECRET_TELEGRAM_CHAT_ID }}
