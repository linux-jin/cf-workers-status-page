name: Deploy

on:
  push:
    branches:
      - main
  watch:
    types: [started]
  repository_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      deployments: write

    env:
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build
        env:
          NODE_ENV: production

      - name: Convert config.yaml to config.json
        shell: bash
        run: |
          yarn add -D js-yaml

          node - <<'NODE'
          const fs = require('fs');
          const yaml = require('js-yaml');

          const config = yaml.load(fs.readFileSync('config.yaml', 'utf8'));
          fs.writeFileSync('config.json', JSON.stringify(config, null, 2));
          NODE

          TARGET_DIRS=""
          for dir in src workers-site; do
            if [ -d "$dir" ]; then
              TARGET_DIRS="${TARGET_DIRS} ${dir}"
            fi
          done

          if [ -n "$TARGET_DIRS" ]; then
            grep -R "config.yaml" -n $TARGET_DIRS || true

            find $TARGET_DIRS -type f \( -name "*.js" -o -name "*.mjs" -o -name "*.ts" \) \
              -exec sed -i 's#../../config.yaml#../../config.json#g' {} \;

            grep -R "config.json" -n $TARGET_DIRS || true
          fi

      - name: Patch wrangler.toml for Wrangler v4
        shell: bash
        run: |
          echo "Original wrangler.toml:"
          cat wrangler.toml

          SITE_ENTRY_POINT=$(awk '
            /^\[site\]/ { in_site=1; next }
            /^\[/ && in_site { in_site=0 }
            in_site && $1 ~ /^entry-point/ {
              gsub(/"/, "", $3);
              print $3;
              exit
            }
          ' wrangler.toml)

          if [ -z "$SITE_ENTRY_POINT" ]; then
            SITE_ENTRY_POINT="."
          fi

          SITE_ENTRY_POINT="${SITE_ENTRY_POINT#./}"
          SITE_ENTRY_POINT="${SITE_ENTRY_POINT%/}"

          if [ -z "$SITE_ENTRY_POINT" ] || [ "$SITE_ENTRY_POINT" = "." ]; then
            SITE_MAIN="index.js"
          else
            SITE_MAIN="${SITE_ENTRY_POINT}/index.js"
          fi

          echo "Detected site main: ${SITE_MAIN}"

          sed -i '/entry-point/d' wrangler.toml

          if grep -qE '^compatibility_date\s*=' wrangler.toml; then
            sed -i 's/^compatibility_date\s*=.*/compatibility_date = "2024-09-23"/' wrangler.toml
          else
            sed -i '1icompatibility_date = "2024-09-23"' wrangler.toml
          fi

          if grep -qE '^compatibility_flags\s*=' wrangler.toml; then
            sed -i 's/^compatibility_flags\s*=.*/compatibility_flags = ["nodejs_compat"]/' wrangler.toml
          else
            sed -i '/^compatibility_date\s*=/acompatibility_flags = ["nodejs_compat"]' wrangler.toml
          fi

          if ! grep -qE '^main\s*=' wrangler.toml; then
            sed -i "1imain = \"${SITE_MAIN}\"" wrangler.toml
          fi

          if grep -q '^\[env.production\]' wrangler.toml; then
            echo "env.production already exists, skip append"
          else
            cat >> wrangler.toml <<'EOF'

          [env.production]
          compatibility_date = "2024-09-23"
          compatibility_flags = ["nodejs_compat"]
          kv_namespaces = [
            { binding = "KV_STATUS_PAGE", id = "cddae738342a487fbff2b90b3cb03123" }
          ]
          EOF
          fi

          echo "Patched wrangler.toml:"
          cat wrangler.toml

      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --env production
          postCommands: |
            yarn kv-gc
          secrets: |
            SECRET_TELEGRAM_API_TOKEN
            SECRET_TELEGRAM_CHAT_ID
        env:
          SECRET_TELEGRAM_API_TOKEN: ${{ secrets.SECRET_TELEGRAM_API_TOKEN }}
          SECRET_TELEGRAM_CHAT_ID: ${{ secrets.SECRET_TELEGRAM_CHAT_ID }}
